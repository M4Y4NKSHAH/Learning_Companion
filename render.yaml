services:
  - type: web
    name: learnerhelp-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Note on Render plans:
    # - If using persistent disk, Render requires 'plan: starter' or higher.
    # - If deploying on the Render free tier, change 'plan: starter' to 'plan: free' and remove the 'disk' block below.
    plan: starter
    disk:
      name: learnerhelp-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: /data
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
